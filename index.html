<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Railgrid</title>
<meta name="description" content="Railgrid: a live 3D metro control dashboard for the Green Line.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Overpass+Mono:wght@400;600&family=Overpass:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-bleed clay diorama of the line; frosted HUD panels pinned to the corners like a strategy game.
   The in-app Day / Night switch is the theme control: body.night swaps every token below. */
:root{
  --accent:#00A86B; --accent-ink:#007A4D; --accent-soft:rgba(0,168,107,.13); --accent-line:rgba(0,168,107,.42);
  --ink:#16201C; --ink-2:#4E5C57; --ink-3:#7D8A85;
  --sky:#E3E7E5;
  --glass:rgba(248,250,249,.66); --glass-hi:rgba(255,255,255,.9); --glass-edge:rgba(255,255,255,.85);
  --hair:rgba(22,32,28,.09); --chip:rgba(22,32,28,.055); --chip-hover:rgba(22,32,28,.09);
  --ok:#00A86B; --warn:#B87D00; --bad:#D23F35; --warn-soft:rgba(214,150,0,.15); --bad-soft:rgba(210,63,53,.12);
  --sig-r:#E5483E; --sig-a:#F2A516; --sig-g:#14C47F;
  --shadow:0 18px 40px -20px rgba(28,44,38,.34),0 2px 8px rgba(28,44,38,.07);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-panel:18px; --pad:12px;
  --top:calc(env(safe-area-inset-top,0px) + 12px);
  --bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  --table-h:238px; --journey-w:440px; --detail-w:348px;
  color-scheme:light;
}
body.night{
  --accent-ink:#3FDB9C; --accent-soft:rgba(0,168,107,.2); --accent-line:rgba(63,219,156,.45);
  --ink:#E7EFEB; --ink-2:#A4B3AD; --ink-3:#6F7E79; --sky:#0E1418;
  --glass:rgba(15,22,26,.62); --glass-hi:rgba(24,33,38,.94); --glass-edge:rgba(255,255,255,.08);
  --hair:rgba(255,255,255,.085); --chip:rgba(255,255,255,.06); --chip-hover:rgba(255,255,255,.11);
  --warn:#F0B429; --bad:#FF6B5E; --warn-soft:rgba(240,180,41,.16); --bad-soft:rgba(255,107,94,.16);
  --shadow:0 18px 40px -18px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font:14px/1.35 var(--f-ui);-webkit-font-smoothing:antialiased;transition:background-color .9s ease;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#scene.grab{cursor:grabbing}#scene.point{cursor:pointer}

/* ---------- glass ---------- */
.glass{position:relative;isolation:isolate;border-radius:var(--r-panel);box-shadow:var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);transition:background-color .9s ease,border-color .9s ease}
.eyebrow{font:600 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- top bar ---------- */
.topbar{position:fixed;z-index:30;top:var(--top);left:var(--pad);right:var(--pad);height:58px;display:flex;align-items:center;gap:14px;padding:0 10px 0 12px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.mark{width:34px;height:34px;flex:none}
.wordmark{font:800 21px/1 var(--f-display);font-stretch:125%;letter-spacing:-.01em}
.line-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font:700 11.5px/1 var(--f-ui);letter-spacing:.02em;white-space:nowrap}
.line-chip i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(0,168,107,.18)}
.search{position:relative;flex:1 1 220px;max-width:330px;min-width:0}
.search-field{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:12px;background:var(--chip);color:var(--ink-2);transition:background .2s}
.search-field:focus-within{background:var(--glass-hi);box-shadow:0 0 0 2px var(--accent-line)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--ink);font:500 13.5px var(--f-ui)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:6px;border:1px solid var(--hair);color:var(--ink-3)}
.search .search-toggle{display:none}
.areas{display:flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--chip);flex:none}
.areas button{height:32px;padding:0 11px;border-radius:9px;font:600 12.5px/1 var(--f-ui);color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.areas button:hover{background:var(--chip-hover);color:var(--ink)}
.areas button.on{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.areas button .code{font-family:var(--f-mono);font-weight:600;letter-spacing:.02em}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 11px;border-radius:12px;background:var(--chip);font:600 13px/1 var(--f-ui);color:var(--ink);white-space:nowrap;transition:background .2s}
.tb-btn:hover{background:var(--chip-hover)}
.tb-btn.icon{width:38px;padding:0;justify-content:center;position:relative}
.tb-btn .chev{width:14px;height:14px;opacity:.6}
.badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/17px var(--f-ui);text-align:center;box-shadow:0 0 0 2px var(--glass-hi)}
.badge[hidden]{display:none}
.clock{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 11px;border-radius:12px;background:var(--chip)}
.clock time{font:600 15px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em;min-width:72px}
.live{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--f-ui);letter-spacing:.12em;color:var(--accent-ink)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.live.paused{color:var(--warn)}.live.paused i{background:var(--warn);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,168,107,.5)}50%{box-shadow:0 0 0 5px rgba(0,168,107,0)}}
.speed{height:28px;min-width:34px;padding:0 7px;border-radius:8px;background:var(--glass-hi);font:700 12px/1 var(--f-mono);color:var(--ink)}
.daynight{position:relative;display:inline-flex;align-items:center;width:62px;height:34px;border-radius:17px;background:var(--chip);flex:none}
.daynight .knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--glass-hi);box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .45s cubic-bezier(.6,.1,.2,1)}
.daynight svg{position:relative;width:16px;height:16px;margin:0 0 0 9px;color:var(--ink-2)}
.daynight svg+svg{margin-left:12px}
body.night .daynight .knob{transform:translateX(28px)}
.user{display:flex;align-items:center;gap:9px;padding-left:4px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--sky);font:800 12px/1 var(--f-display);font-stretch:112%;letter-spacing:.04em}
.user-txt{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.user-txt b{font:700 13px var(--f-ui)}.user-txt small{font:500 11px var(--f-ui);color:var(--ink-3)}

/* ---------- menus ---------- */
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 8px);right:0;z-index:40;min-width:260px;padding:6px;border-radius:14px;background:var(--glass-hi);border:1px solid var(--hair);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.menu-item{display:flex;align-items:flex-start;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.menu-item:hover,.menu-item.kb{background:var(--chip)}
.menu-item .mi-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--ink-2);flex:none}
.menu-item.on .mi-ico{background:var(--accent);color:#fff}
.menu-item b{display:block;font:700 13px/1.2 var(--f-ui)}
.menu-item small{display:block;font:500 11.5px/1.3 var(--f-ui);color:var(--ink-3);margin-top:2px}
.menu-title{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px}
.menu-title button{font:600 12px var(--f-ui);color:var(--accent-ink)}
.alerts-menu{width:360px;max-height:min(460px,70vh);overflow:auto}
.alert-row{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.alert-row:hover{background:var(--chip)}
.alert-row .sev{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--ink-3)}
.alert-row .sev.warn{background:var(--warn)}.alert-row .sev.crit{background:var(--bad)}.alert-row .sev.ok{background:var(--accent)}
.alert-row p{margin:0;font:500 12.5px/1.35 var(--f-ui)}
.alert-row time{font:500 11px/1.4 var(--f-mono);color:var(--ink-3)}
.alert-row.unread p{font-weight:700}
.search-results{left:0;right:auto;width:100%;min-width:280px}
.sr-type{font:600 10px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-left:auto;align-self:center}
.empty-note{padding:12px;color:var(--ink-3);font-size:12.5px}

/* ---------- KPI cards ---------- */
.kpis{position:fixed;z-index:20;top:calc(var(--top) + 70px);left:var(--pad);display:grid;grid-template-columns:repeat(3,198px);gap:10px}
.kpi{padding:12px 14px 12px;display:grid;grid-template-rows:auto auto auto;gap:6px;min-width:0}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-val{font:800 30px/1 var(--f-display);font-stretch:118%;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.kpi-val small{font:700 13px var(--f-ui);color:var(--ink-3);margin-left:3px;letter-spacing:0;font-stretch:100%}
.kpi-sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 11.5px/1.2 var(--f-ui);color:var(--ink-2);min-height:22px;white-space:nowrap}
.trend{font:700 11px/1 var(--f-mono)}
.trend.up{color:var(--accent-ink)}.trend.down{color:var(--bad)}
.fleetbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;flex:1}
.fleetbar i{display:block;height:100%}
.spark{width:70px;height:24px;flex:none;overflow:visible}

/* ---------- detail panel ---------- */
.detail{position:fixed;z-index:20;top:calc(var(--top) + 70px);right:var(--pad);width:var(--detail-w);bottom:calc(var(--bottom) + var(--table-h) + 10px);display:flex;flex-direction:column;min-height:0;transition:bottom .3s ease}
.sheet-handle{display:none}
.d-head{padding:14px 16px 12px;border-bottom:1px solid var(--hair);display:grid;gap:6px}
.d-head-row{display:flex;align-items:flex-start;gap:10px}
.d-title{font:800 22px/1.1 var(--f-display);font-stretch:112%;letter-spacing:-.01em;margin:2px 0 0;text-wrap:balance}
.d-sub{font:500 12.5px/1.35 var(--f-ui);color:var(--ink-2)}
.d-actions{display:flex;gap:6px;margin-left:auto;flex:none}
.d-btn{height:30px;padding:0 10px;border-radius:9px;background:var(--chip);font:700 12px/1 var(--f-ui);display:inline-flex;align-items:center;gap:6px}
.d-btn:hover{background:var(--chip-hover)}
.d-btn.on{background:var(--accent);color:#fff}
.d-btn.icon{width:30px;padding:0;justify-content:center}
.d-body{flex:1;overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0;overscroll-behavior:contain}
.d-body>*{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font:700 11px/1 var(--f-ui);letter-spacing:.02em;background:var(--chip);color:var(--ink-2);white-space:nowrap;width:max-content}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-radius:12px;overflow:hidden;background:var(--hair)}
.stat{background:var(--glass-hi);padding:9px 11px;display:grid;gap:3px;min-width:0}
.stat span{font:600 10px/1 var(--f-ui);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.stat b{font:700 16px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b small{font:600 11px var(--f-ui);color:var(--ink-3);margin-left:2px}
.stat .late{color:var(--bad)}.stat .early{color:var(--accent-ink)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sec-h h3{margin:0;font:700 12.5px/1.2 var(--f-ui)}
.sec-h small{font:500 11px var(--f-mono);color:var(--ink-3)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);transition:width .5s ease}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.plat{display:grid;gap:7px;padding:11px 12px;border-radius:12px;background:var(--glass-hi);border:1px solid var(--hair)}
.plat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 12.5px var(--f-ui)}
.plat-h .num{font-size:12px;color:var(--ink-2)}
.plat-row{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-ui);color:var(--ink-2)}
.plat-row b{font:700 12px var(--f-mono);color:var(--ink)}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font:500 12.5px var(--f-ui);text-align:left;width:100%}
button.li:hover{background:var(--chip)}
.li .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-3);background:var(--glass-hi)}
.li.done .dot{background:var(--ink-3);border-color:var(--ink-3)}
.li.now .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.li.done{color:var(--ink-3)}
.li .num{font-size:12px;color:var(--ink-2)}
.li .num.late{color:var(--bad)}
.netrow{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;align-items:center;padding:8px;border-radius:10px;text-align:left;width:100%}
.netrow:hover{background:var(--chip)}
.netrow b{display:block;font:700 13px var(--f-ui)}
.netrow small{display:block;font:500 11px var(--f-mono);color:var(--ink-3);margin-top:2px}
.netrow .mini{display:grid;gap:3px;font:600 10px var(--f-mono);color:var(--ink-3)}
.netrow .bar{height:6px}
.net-h{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;padding:0 8px;font:600 10px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.cond{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--glass-hi);border:1px solid var(--hair)}
.cond .mi-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.cond b{display:block;font:700 13px var(--f-ui)}.cond small{display:block;font:500 11.5px/1.35 var(--f-ui);color:var(--ink-2)}
.aspects{display:flex;gap:6px;flex-wrap:wrap}
.asp{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--chip);font:600 11px var(--f-mono);color:var(--ink-2)}
.asp i{width:9px;height:9px;border-radius:50%}
.lamp-R{background:var(--sig-r)}.lamp-A{background:var(--sig-a)}.lamp-G{background:var(--sig-g)}
.sigface{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--glass-hi);border:1px solid var(--hair)}
.sighead{display:grid;gap:5px;padding:7px 6px;border-radius:9px;background:#26302D;flex:none}
.sighead i{width:14px;height:14px;border-radius:50%;background:#3B4643}
.sighead i.on.R{background:var(--sig-r);box-shadow:0 0 10px var(--sig-r)}
.sighead i.on.A{background:var(--sig-a);box-shadow:0 0 10px var(--sig-a)}
.sighead i.on.G{background:var(--sig-g);box-shadow:0 0 10px var(--sig-g)}

/* ---------- journey tracker ---------- */
.journey{position:fixed;z-index:20;left:var(--pad);bottom:var(--bottom);width:var(--journey-w);padding:13px 16px 14px;display:grid;gap:12px}
.j-head{display:flex;align-items:center;gap:10px}
.j-head h2{margin:0;font:800 15px/1.1 var(--f-display);font-stretch:112%}
.j-route{display:flex;align-items:center;gap:8px;font:600 12.5px var(--f-ui);color:var(--ink-2);margin-left:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.j-route b{color:var(--ink);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.steps::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:9px;height:3px;border-radius:2px;background:var(--chip)}
.steps .prog{position:absolute;left:calc(100%/12);top:9px;height:3px;border-radius:2px;background:var(--accent);transition:width .45s ease}
.step{position:relative;display:grid;justify-items:center;gap:7px;text-align:center}
.step i{width:21px;height:21px;border-radius:50%;background:var(--glass-hi);border:2px solid var(--hair);display:grid;place-items:center;transition:all .3s}
.step i::after{content:"";width:7px;height:7px;border-radius:50%;background:transparent}
.step span{font:600 10.5px/1.15 var(--f-ui);color:var(--ink-3);letter-spacing:.01em}
.step.done i{background:var(--accent);border-color:var(--accent)}
.step.done i::after{background:#fff;width:6px;height:6px}
.step.now i{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.step.now i::after{background:var(--accent);animation:blink 1.2s ease-in-out infinite}
.step.now span{color:var(--ink);font-weight:800}
@keyframes blink{50%{opacity:.35}}
.j-foot{display:flex;justify-content:space-between;gap:10px;font:500 12px var(--f-ui);color:var(--ink-2)}
.j-foot b{font:700 12.5px var(--f-mono);color:var(--ink)}
.j-empty{display:flex;align-items:center;justify-content:space-between;gap:12px;font:500 12.5px var(--f-ui);color:var(--ink-2)}

/* ---------- table ---------- */
.tablep{position:fixed;z-index:20;left:calc(var(--pad) + var(--journey-w) + 10px);right:var(--pad);bottom:var(--bottom);height:var(--table-h);display:flex;flex-direction:column;min-width:0;transition:height .3s ease}
.tabs{display:flex;align-items:center;gap:4px;padding:8px 10px 6px;border-bottom:1px solid var(--hair)}
.tabs [role=tab]{height:30px;padding:0 12px;border-radius:9px;font:700 12.5px/1 var(--f-ui);color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.tabs [role=tab]:hover{background:var(--chip)}
.tabs [role=tab][aria-selected=true]{background:var(--ink);color:var(--sky)}
.tabs .count{font:600 11px var(--f-mono);opacity:.7}
.tabs .t-note{margin-left:auto;font:500 11.5px var(--f-ui);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapse{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.collapse:hover{background:var(--chip)}
.collapse svg{transition:transform .3s}
body.table-min .collapse svg{transform:rotate(180deg)}
.table-scroll{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain}
table{width:100%;border-collapse:collapse;font:500 12.5px var(--f-ui);min-width:640px}
thead th{position:sticky;top:0;z-index:1;background:var(--glass-hi);text-align:left;font:600 10px/1 var(--f-ui);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;white-space:nowrap}
tbody td{padding:7px 10px;border-top:1px solid var(--hair);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--chip)}
tbody tr.sel td{background:var(--accent-soft)}
td.num,th.num{text-align:right}
td .mono{font-family:var(--f-mono);font-weight:600}
td .late{color:var(--bad);font-family:var(--f-mono)}td .ontime{color:var(--accent-ink);font-family:var(--f-mono)}
.cbar{display:inline-grid;grid-template-columns:52px auto;gap:7px;align-items:center}
.cbar .bar{height:6px}
body.table-min{--table-h:46px}

/* ---------- floating labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;pointer-events:none}
.pin{display:flex;align-items:center;gap:6px;transform:translate(-50%,-100%);padding:4px 9px 4px 5px;border-radius:12px;background:var(--glass-hi);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);font:700 11.5px/1 var(--f-ui);color:var(--ink);border:1px solid var(--hair)}
.pin .code{display:grid;place-items:center;height:17px;padding:0 5px;border-radius:6px;background:var(--accent);color:#fff;font:700 9.5px/1 var(--f-mono);letter-spacing:.04em}
.pin .crowd{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pin .crowd.warn{background:var(--warn)}.pin .crowd.bad{background:var(--bad)}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);transform:translateX(-50%) rotate(45deg)}
.ttag{transform:translate(-50%,-100%);padding:3px 6px;border-radius:7px;background:rgba(22,32,28,.78);color:#fff;font:700 10px/1 var(--f-mono);letter-spacing:.02em}
.ttag.depot{background:rgba(110,120,116,.8)}
.sel-lbl{transform:translate(-50%,calc(-100% - 10px));padding:7px 11px;border-radius:12px;background:var(--accent);color:#fff;font:700 12px/1.15 var(--f-ui);box-shadow:0 8px 22px -8px rgba(0,120,76,.7)}
.sel-lbl small{display:block;font:600 10.5px var(--f-mono);opacity:.85;margin-top:2px}
.hov-lbl{transform:translate(-50%,calc(-100% - 8px));padding:5px 8px;border-radius:9px;background:var(--glass-hi);color:var(--ink);font:700 11px/1.1 var(--f-ui);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);border:1px solid var(--hair)}

/* ---------- hint + toast + mobile bar ---------- */
.hint{position:fixed;z-index:15;left:var(--pad);top:calc(var(--top) + 196px);padding:7px 12px;border-radius:10px;background:var(--glass-hi);border:1px solid var(--hair);font:600 12px var(--f-ui);color:var(--ink-2);box-shadow:var(--shadow);transition:opacity .6s;white-space:nowrap}
.hint.fade{opacity:0;pointer-events:none}
.toast{position:fixed;z-index:35;left:50%;bottom:calc(var(--bottom) + var(--table-h) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--glass-hi);border:1px solid var(--hair);box-shadow:var(--shadow);font:600 12.5px var(--f-ui);max-width:min(520px,calc(100vw - 32px))}
.toast .sev{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn)}
.toast .sev.crit{background:var(--bad)}.toast .sev.ok,.toast .sev.info{background:var(--accent)}
.mobile-bar{display:none}
.sheet-close{display:none}
.wx-banner{display:none}

/* ---------- responsive ---------- */
@media (max-width:1599px){.user-txt{display:none}#weatherLabel{display:none}}
@media (max-width:1480px){.line-chip{display:none}.search{max-width:260px}}
@media (min-width:1241px){.search{min-width:170px}}
@media (max-width:1240px){
  .search{flex:none}
  .search .search-field{display:none}
  .search .search-toggle{display:inline-flex}
  .search.open .search-field{display:flex;position:absolute;top:-19px;left:0;width:300px;z-index:41;background:var(--glass-hi);box-shadow:var(--shadow),0 0 0 2px var(--accent-line)}
  #weatherLabel{display:none}
  .kpis{grid-template-columns:repeat(3,176px)}
  :root{--journey-w:400px;--detail-w:320px}
}
@media (max-width:1060px){
  .areas button{padding:0 8px}
  .areas .full{display:none}
  .kpis{grid-template-columns:repeat(3,160px)}
  .kpi-val{font-size:25px}
  .spark{width:64px}
}
@media (min-width:1061px){.areas .short{display:none}}
@media (max-width:860px){
  .areas{display:none}
  .mobile-bar{display:flex}
}
@media (max-width:860px){
  :root{--pad:8px;--r-panel:16px}
  .topbar{height:52px;gap:6px;padding:0 6px 0 8px}
  .wordmark{font-size:18px}
  .mark{width:30px;height:30px}
  .tb-right{gap:5px}
  .user{display:none}
  .clock{padding:0 4px 0 8px;gap:6px}
  .clock time{font-size:13px;min-width:62px}
  .live span{display:none}
  .tb-btn{height:36px;padding:0 9px}.tb-btn.icon{width:36px}
  .tb-btn .chev{display:none}
  .daynight{width:56px;height:32px}
  .daynight .knob{width:26px;height:26px}
  body.night .daynight .knob{transform:translateX(24px)}
  .daynight svg{margin-left:8px;width:14px;height:14px}.daynight svg+svg{margin-left:12px}
  .search.open .search-field{position:fixed;top:calc(var(--top) + 60px);left:var(--pad);right:var(--pad);width:auto}
  .search-results{position:fixed;top:calc(var(--top) + 104px);left:var(--pad);right:var(--pad);width:auto}
  .kpis{top:calc(var(--top) + 60px);right:var(--pad);grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .kpi{padding:8px 10px;gap:3px}
  .kpi-val{font-size:20px}
  .kpi-val small{font-size:11px}
  .kpi .eyebrow{font-size:9px;letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi-sub,.kpi-top .trend{display:none}
  .hint{top:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom) + 128px);font-size:11.5px;max-width:calc(100vw - 32px);white-space:normal;text-align:center}
  .journey{display:none}
  .detail{top:auto;left:var(--pad);right:var(--pad);width:auto;bottom:calc(var(--bottom) + 52px);max-height:52vh;transition:none}
  .detail.peek .d-body{display:none}
  .sheet-handle{display:block;width:40px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.4;margin:7px auto -4px}
  .d-head{padding:10px 14px 10px;cursor:pointer}
  .detail.peek .d-head{border-bottom:0}
  .d-title{font-size:18px}
  .detail .journey-in{display:grid}
  .tablep{left:var(--pad);right:var(--pad);bottom:var(--bottom);height:62vh;z-index:32;transform:translateY(calc(100% + 40px));transition:transform .35s cubic-bezier(.3,.1,.2,1)}
  body.table-open .tablep{transform:none}
  body.table-min{--table-h:62vh}
  .tablep .collapse{display:none}
  .sheet-close{display:grid}
  .toast{bottom:auto;top:calc(var(--top) + 122px)}
  .mobile-bar{position:fixed;z-index:25;left:var(--pad);right:var(--pad);bottom:var(--bottom);height:44px;align-items:center;gap:6px;padding:4px;border-radius:14px}
  .mb-areas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .mb-areas::-webkit-scrollbar{display:none}
  .mb-areas button,.mb-table{flex:none;height:36px;padding:0 12px;border-radius:10px;font:700 12px/1 var(--f-ui);color:var(--ink-2);white-space:nowrap}
  .mb-areas button.on{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .mb-table{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--sky)}
}
@media (max-width:420px){
  .wordmark{display:none}
  .kpi-val{font-size:18px}
}
.journey-in{display:none}
@media (max-height:640px) and (min-width:861px){:root{--table-h:170px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* =====================================================================
   RAILGRID · Green Line live control
   ===================================================================== */

// ---------- world constants ----------
const X0 = -220, X1 = 220, Z0 = -158, Z1 = 110;      // diorama slab
const DECK_Y = 7.0;                                 // viaduct track-bed level
const GROUND_TRACK_Y = 0.5;                         // depot track-bed level
const RAIL_H = 0.36;                                // rail top above track bed
const TRACK_HALF = 2.6;                             // track centre offset from line centre
const CAR_LEN = 6.6, CAR_GAP = 0.45, NCARS = 4;
const TRAIN_LEN = NCARS * CAR_LEN + (NCARS - 1) * CAR_GAP;
const PLAT_Y = DECK_Y + RAIL_H + 1.0;               // platform surface = car floor
const U2KMH = 10.1;                                 // 1 unit ≈ 2.8 m
const M_PER_U = 2.8;
const CAPACITY = 1120, CRUSH = 1480;

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(7311);
const rr = (a, b) => a + (b - a) * R();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pickR = a => a[Math.floor(R() * a.length)];
const rnd = (a, b) => a + (b - a) * Math.random();
const isMobile = matchMedia('(max-width: 860px)').matches || /Android|iPhone|iPad/i.test(navigator.userAgent);

// ---------- Path: lines + constant-radius arcs, exact offsets ----------
// heading h: direction (cos h, sin h) in (x, z). Positive arc deg = right turn (towards +z when heading +x).
class Path {
  constructor(x, z, h, segs, yFn) {
    this.segs = [];
    let px = x, pz = z, ph = h, s = 0;
    for (const g of segs) {
      if (g.len !== undefined) {
        this.segs.push({ t: 'L', s0: s, len: g.len, x: px, z: pz, h: ph });
        px += Math.cos(ph) * g.len; pz += Math.sin(ph) * g.len; s += g.len;
      } else {
        const k = (g.deg > 0 ? 1 : -1) / g.r, len = Math.abs(g.deg) * Math.PI / 180 * g.r;
        this.segs.push({ t: 'A', s0: s, len, x: px, z: pz, h: ph, k });
        const h2 = ph + k * len;
        px += (Math.sin(h2) - Math.sin(ph)) / k; pz += (Math.cos(ph) - Math.cos(h2)) / k; ph = h2; s += len;
      }
    }
    this.length = s; this.end = { x: px, z: pz, h: ph }; this.yFn = yFn || (() => 0);
  }
  at(s, o = {}) {
    const S = this.segs;
    if (s < 0) { const g = S[0]; o.x = g.x + Math.cos(g.h) * s; o.z = g.z + Math.sin(g.h) * s; o.h = g.h; }
    else if (s > this.length) { const e = this.end, d = s - this.length; o.x = e.x + Math.cos(e.h) * d; o.z = e.z + Math.sin(e.h) * d; o.h = e.h; }
    else {
      let i = 0; while (i < S.length - 1 && S[i + 1].s0 <= s) i++;

// ---------- stations ----------
function buildStation(st) {
  const X = st.x, Z = st.zc;
  const bx = (lx, y, lz, w, h, d, col, b = B.clay) => box(b, X + lx, y, Z + lz, w, h, d, col);
  const roofY = d => 13.0 + 1.25 * (1 - (d / 9.8) ** 2);
  for (const sg of [1, -1]) {
    bx(0, (DECK_Y - 1.7 + PLAT_Y) / 2, sg * 6.25, 37, PLAT_Y - DECK_Y + 1.7, 4.3, PAL.concrete, B.paved);
    bx(0, PLAT_Y - 0.43, sg * 8.42, 37, 0.86, 0.06, PAL.accent);
    bx(0, PLAT_Y + 0.008, sg * 4.55, 36.6, 0.02, 0.45, C('#F3F0E4'), B.paved);
    for (const lx of [-15, -9, -3, 3, 9, 15]) rb(B.clay, X + lx, PLAT_Y, Z + sg * 7.75, 0.5, roofY(7.75) - PLAT_Y + 0.05, 0.5, PAL.white, 0, 0.2, 0.05);
    for (const lx of [-12.5, 12.5]) { bx(lx, PLAT_Y + 0.42, sg * 7.2, 2.4, 0.12, 0.6, PAL.concrete2); bx(lx - 0.9, PLAT_Y + 0.18, sg * 7.2, 0.15, 0.36, 0.5, PAL.dark); bx(lx + 0.9, PLAT_Y + 0.18, sg * 7.2, 0.15, 0.36, 0.5, PAL.dark); }
    for (const lx of [-9.5, 9.5]) { bx(lx, 11.35, sg * 5.7, 3.8, 0.8, 0.14, PAL.accent); bx(lx, 11.36, sg * 5.62, 3.3, 0.12, 0.02, PAL.white); for (const k of [-1.4, 1.4]) bx(lx + k, 12.35, sg * 5.7, 0.06, 1.2, 0.06, PAL.dark); }
    // stair + escalator housing on platform
    bx(0, PLAT_Y + 1.3, sg * 7.25, 8.4, 2.6, 2.1, null, B.glass);
    bx(0, PLAT_Y + 2.69, sg * 7.25, 8.8, 0.18, 2.4, PAL.concrete);
    for (const lx of [-4.25, 4.25]) bx(lx, PLAT_Y + 1.3, sg * 7.25, 0.14, 2.6, 2.2, PAL.concrete);
    bx(0, PLAT_Y + 0.01, sg * 7.25, 7.8, 0.02, 1.7, PAL.dark);
    // concourse glazing
    B.win0.quad([X - 11.3, 4.15, Z + sg * 13.63], [X + 11.3, 4.15, Z + sg * 13.63], [X + 11.3, 5.05, Z + sg * 13.63], [X - 11.3, 5.05, Z + sg * 13.63], PAL.white, [0, 0, sg]);
    // street escalator bank
    const ex = X - 8, z0 = Z + sg * 13.6, z1 = Z + sg * 20.6;
    beam(B.clay, [ex, 3.6, z0], [ex, -0.3, z1], 3.1, 0.6, PAL.concrete);
    beam(B.paved, [ex, 3.93, z0], [ex, 0.03, z1], 2.6, 0.06, C('#97A19D'));
    for (const k of [-1.45, 1.45]) { beam(B.glass, [ex + k, 4.45, z0], [ex + k, 0.55, z1], 0.06, 1.0, null); beam(B.clay, [ex + k, 4.98, z0], [ex + k, 1.08, z1], 0.14, 0.1, PAL.dark); }
    beam(B.glass, [ex, 6.6, z0], [ex, 2.7, z1], 3.5, 0.08, null);
    for (const k of [-1.7, 1.7]) beam(B.clay, [ex + k, 6.62, z0], [ex + k, 2.72, z1], 0.14, 0.14, PAL.concrete);
    for (const zz of [z1 - sg * 0.2]) for (const k of [-1.7, 1.7]) bx(ex - X + k, 1.35, zz - Z, 0.14, 2.7, 0.14, PAL.concrete);
    // lift tower
    bx(9, 2.65, sg * 16.5, 2.6, 5.3, 2.6, null, B.glass);
    bx(9, 5.45, sg * 16.5, 2.9, 0.3, 2.9, PAL.concrete);
    for (const [a, b] of [[-1.3, -1.3], [1.3, -1.3], [-1.3, 1.3], [1.3, 1.3]]) bx(9 + a, 2.65, sg * 16.5 + b, 0.16, 5.3, 0.16, PAL.concrete);
    bx(9, 2.4, sg * 16.5, 1.4, 1.6, 1.4, PAL.concrete2);
    // plaza, totem, trees
    quadUp(B.paved, X - 20, Z + sg * 11, X + 20, Z + sg * 27, 0.06, PAL.plaza);
    cyl(B.clay, X - 13.5, 3.1, Z + sg * 22.5, 0.17, 6.2, PAL.white);
    B.clay.add(G.cyl16, M(X - 13.5, 6.6, Z + sg * 22.5, 1.05, 0.22, 1.05, 0, Math.PI / 2), PAL.accent);
    B.clay.add(G.cyl16, M(X - 13.5, 6.6, Z + sg * 22.5, 0.55, 0.26, 0.55, 0, Math.PI / 2), PAL.white);
    for (const [tx, tz] of [[2, 22], [15, 24.5], [-17.5, 18.5]]) tree(X + tx, Z + sg * tz, 1.0);
    bx(4.5, 0.32, sg * 15.2, 3.2, 0.12, 0.7, PAL.concrete2); bx(-2, 0.32, sg * 25.2, 3.2, 0.12, 0.7, PAL.concrete2);
  }
  // concourse box + supports
  rb(B.clay, X, 3.9, Z, 24, 1.42, 27.2, PAL.concrete, 0, 0.8, 0.12);
  B.win1.quad([X + 12.02, 4.15, Z - 12.4], [X + 12.02, 4.15, Z + 12.4], [X + 12.02, 5.05, Z + 12.4], [X + 12.02, 5.05, Z - 12.4], PAL.white, [1, 0, 0]);
  B.win1.quad([X - 12.02, 4.15, Z - 12.4], [X - 12.02, 4.15, Z + 12.4], [X - 12.02, 5.05, Z + 12.4], [X - 12.02, 5.05, Z - 12.4], PAL.white, [-1, 0, 0]);
  for (const [a, b] of [[-10, -12.6], [10, -12.6], [-10, 12.6], [10, 12.6]]) rb(B.clay, X + a, 0, Z + b, 1.0, 3.92, 1.0, PAL.concrete2, 0, 0.25, 0.05);
  // median columns under the station
  rb(B.clay, X, 0.2, Z, 1.8, 3.7, 1.8, PAL.concrete2, 0, 0.35, 0.08);
  for (const lx of [-16, 16]) rb(B.clay, X + lx, 0.2, Z, 1.8, DECK_Y - 1.7 - 0.2, 1.8, PAL.concrete2, 0, 0.35, 0.08);
  // night light
  for (const sg of [1, -1]) {
    for (const lx of [-12, 0, 12]) pools.push([X + lx, PLAT_Y + 0.03, Z + sg * 6.1, 7.5, 0xE4FFF2]);
    pools.push([X, 0.09, Z + sg * 5.5, 13, 0xE9FFF4]);
    pools.push([X - 8, 0.1, Z + sg * 22, 10, 0xFFE4BD]);
  }
  // canopy roof
  // canopy: glass shell on white ribs so dwelling trains stay visible from above
  const roofPath = new Path(X - 19.5, Z, 0, [{ len: 39 }]);
  const arc = (d0, d1, n) => { const bot = [], top = []; for (let i = 0; i <= n; i++) { const d = d0 + (d1 - d0) * i / n; bot.push([d, roofY(d)]); top.push([d, roofY(d) + 0.34]); } return [...bot, ...top.reverse()]; };
  sweep(B.glass, roofPath, 0, 39, arc(-7.6, 7.6, 12), null, { step: 40 });
  sweep(B.clay, roofPath, 0, 39, arc(7.6, 9.8, 3), PAL.white, { step: 40 });
  sweep(B.clay, roofPath, 0, 39, arc(-9.8, -7.6, 3), PAL.white, { step: 40 });
  for (let lx = -19.2; lx <= 19.3; lx += 6.4) for (let i = 0; i < 12; i++) { const d0 = -7.6 + 15.2 * i / 12, d1 = -7.6 + 15.2 * (i + 1) / 12; beam(B.clay, [X + lx, roofY(d0) + 0.12, Z + d0], [X + lx, roofY(d1) + 0.12, Z + d1], 0.26, 0.4, PAL.white); }
  bx(0, roofY(0) + 0.1, 0, 39, 0.42, 0.55, PAL.white);
  for (const sg of [1, -1]) bx(0, 13.18, sg * 9.85, 39.2, 0.52, 0.3, PAL.accent);
  for (const d of [-8.6, -4.4, 4.4, 8.6]) bx(0, roofY(d) - 0.06, d, 37, 0.06, 0.3, null, B.glow);
}

// ---------- trees, lamps ----------
const treeSpots = [];
function tree(x, z, s = 1, col) {
  if (x < X0 + 2 || x > X1 - 2 || z < Z0 + 2 || z > Z1 - 2) return false;
  for (const t of treeSpots) if (Math.abs(t[0] - x) < 2.6 && Math.abs(t[1] - z) < 2.6) return false;

$('#mbTable').addEventListener('click', () => { document.body.classList.toggle('table-open'); renderTable(); });

// ---------- KPIs ----------
const trainsInService = () => trains.filter(t => t.inService && (t.state === 'run' || t.state === 'dwell' || t.state === 'term')).length;
const ontimePct = () => ontimeLog.length ? ontimeLog.reduce((a, b) => a + b, 0) / ontimeLog.length * 100 : 100;
function renderKPIs() {
  const n = trainsInService();
  $('#kTrains').innerHTML = `${n}<small>/ ${trains.length}</small>`;
  const dep = trains.filter(t => t.state === 'stabled' || t.toDepot || t.state === 'link' || t.released).length;
  const seg = [[n, 'var(--accent)'], [dep, 'var(--ink-3)'], [1, 'var(--warn)']];
  $('#kFleet').innerHTML = seg.map(([v, c]) => `<i style="flex:${v};background:${c}"></i>`).join('');
  $('#kFleetTxt').textContent = `target ${fleetTarget()} · ${dep} depot`;
  const ot = ontimePct();
  $('#kOntime').innerHTML = `${ot.toFixed(1)}<small>%</small>`;
  const prev = kpiHist.ontime.length > 20 ? kpiHist.ontime[kpiHist.ontime.length - 21] : null;
  const tr = $('#kOntimeTrend'); if (prev != null) { const d = ot - prev; tr.textContent = `${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}`; tr.className = 'trend ' + (d >= 0 ? 'up' : 'down'); }
  $('#kOntimeSpark').innerHTML = spark(kpiHist.ontime.slice(-40), 84, 24, { min: Math.min(80, ...kpiHist.ontime.slice(-40)), max: 100 });
  $('#kRiders').textContent = fmtInt(ridersToday);
  const rate = lineRate(simT) * 60 * SEASON.ridership;
  $('#kRidersTxt').textContent = `+${fmtInt(rate)} / min`;
  $('#kRidersSpark').innerHTML = spark(kpiHist.rate.slice(-40), 84, 24, { min: 0 });
}

// ---------- top bar: clock, speed, day/night, weather, alerts, search, areas ----------
let simSpeed = 1;
const SPEEDS = [1, 2, 4, 0];
$('#speedBtn').addEventListener('click', () => { simSpeed = SPEEDS[(SPEEDS.indexOf(simSpeed) + 1) % SPEEDS.length]; updateSpeedUI(); });
function updateSpeedUI() {
  const b = $('#speedBtn'), lv = $('#liveBadge');
  b.innerHTML = simSpeed ? `${simSpeed}×` : `<svg class="i" style="width:14px;height:14px;vertical-align:-2px"><use href="#i-pause"/></svg>`;
  b.setAttribute('aria-label', simSpeed ? `Simulation speed ${simSpeed}×` : 'Simulation paused');
  lv.classList.toggle('paused', !simSpeed); lv.querySelector('span').textContent = simSpeed === 1 ? 'LIVE' : simSpeed ? 'SIM' : 'PAUSED';
}
function setNight(on) { env.target = on ? 1 : 0; document.body.classList.toggle('night', on); $('#dayNight').setAttribute('aria-checked', on); }
$('#dayNight').addEventListener('click', () => setNight(env.target < 0.5));
const weatherMenu = $('#weatherMenu');
function renderWeatherMenu() {
  weatherMenu.innerHTML = Object.values(SEASONS).map(s => `<button class="menu-item ${s === SEASON ? 'on' : ''}" data-season="${s.id}" role="menuitemradio" aria-checked="${s === SEASON}"><span class="mi-ico"><svg class="i"><use href="#${s.icon}"/></svg></span><span><b>${s.label}</b><small>${s.desc}</small></span></button>`).join('');
}
function setSeason(id, quiet) {
  SEASON = SEASONS[id];
  $('#weatherLabel').textContent = SEASON.label; $('#weatherIcon').innerHTML = `<use href="#${SEASON.icon}"/>`;
  env.rainT = id === 'monsoon' ? 1 : 0; env.wetT = id === 'monsoon' ? 1 : 0; env.fogT = id === 'fog' ? 1 : 0;
  for (const term of [termW, termE]) term.nextSlot = Math.min(term.nextSlot, simT + H());
  if (!quiet) alert(id === 'clear' ? 'ok' : 'warn', { clear: 'Conditions clear: normal timetable restored', monsoon: 'Monsoon: wet-rail speed limit 43 km/h in force, dwell times extended', fog: 'Fog: caution running at 55 km/h, signal sighting reduced', festival: 'Festival rush: headway cut to 58 s, extra trains released from Northfield' }[id], null);
  renderWeatherMenu(); renderDetail(true);
}
const alertsMenu = $('#alertsMenu');
function renderAlerts() {
  alertsMenu.innerHTML = `<div class="menu-title"><span class="eyebrow">Alerts · ${alerts.length}</span><button data-act="read">Mark all read</button></div>` + (alerts.length ? alerts.slice(0, 30).map(a => `<button class="alert-row ${a.unread ? 'unread' : ''}" data-alert="${a.id}"><span class="sev ${a.sev}"></span><p>${esc(a.text)}</p><time>${fmtHM(a.t)}</time></button>`).join('') : '<div class="empty-note">No alerts.</div>');
}
function updateBadge() { const b = $('#alertBadge'); b.hidden = !unread; b.textContent = unread > 9 ? '9+' : unread; }
function openMenu(btn, menu, render) {
  const open = menu.hidden; closeMenus();
  if (open) { render && render(); menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
}
function closeMenus() { for (const [b, m] of [['#weatherBtn', '#weatherMenu'], ['#alertsBtn', '#alertsMenu']]) { $(m).hidden = true; $(b).setAttribute('aria-expanded', 'false'); } $('#searchResults').hidden = true; }
$('#weatherBtn').addEventListener('click', e => { e.stopPropagation(); openMenu($('#weatherBtn'), weatherMenu, renderWeatherMenu); });
$('#alertsBtn').addEventListener('click', e => { e.stopPropagation(); openMenu($('#alertsBtn'), alertsMenu, renderAlerts); });
weatherMenu.addEventListener('click', e => { const b = e.target.closest('[data-season]'); if (b) { setSeason(b.dataset.season); closeMenus(); } });
alertsMenu.addEventListener('click', e => {
  e.stopPropagation();
  if (e.target.closest('[data-act=read]')) { alerts.forEach(a => a.unread = false); unread = 0; updateBadge(); renderAlerts(); return; }
  const b = e.target.closest('[data-alert]'); if (!b) return;
  const a = alerts.find(x => x.id === +b.dataset.alert); if (!a) return;
  if (a.unread) { a.unread = false; unread = Math.max(0, unread - 1); updateBadge(); }
  closeMenus(); if (a.ref) select(a.ref);
});
document.addEventListener('click', e => { if (!e.target.closest('.dd') && !e.target.closest('.search')) closeMenus(); });
let toastTimer = 0;
onAlert = a => {
  updateBadge();
  if (!alertsMenu.hidden) renderAlerts();
  if (a.sev === 'info' && !(a.ref === depot)) return;
  const el = $('#toast'); el.innerHTML = `<span class="sev ${a.sev}"></span><span>${esc(a.text)}</span>`; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 4200);
};
// search
const searchInput = $('#searchInput'), searchResults = $('#searchResults');
let sIdx = 0, sItems = [];
function searchItems(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const all = [
    ...trains.map(t => ({ e: t, label: `${t.run} · ${t.rake}`, sub: trainWhere(t), ico: 'i-train', type: 'Train', key: `${t.run} ${t.rake} train` })),
    ...STATIONS.map(s => ({ e: s, label: s.name, sub: `${s.id} · 2 platforms`, ico: 'i-station', type: 'Station', key: `${s.name} ${s.id} station` })),
    { e: depot, label: 'Northfield Depot', sub: 'NFD · wash plant, stabling', ico: 'i-depot', type: 'Depot', key: 'northfield depot nfd wash' },
    ...SIGNALS.map(s => ({ e: s, label: s.id, sub: SIG_KIND[s.kind], ico: 'i-signal', type: 'Signal', key: `${s.id} ${s.id.replace('-', '')} signal ${s.kind}` })),
  ];
  return all.filter(i => i.key.toLowerCase().includes(q)).slice(0, 8);
}
function renderSearch() {
  sItems = searchItems(searchInput.value);
  if (!searchInput.value.trim()) { searchResults.hidden = true; return; }
  sIdx = clamp(sIdx, 0, Math.max(0, sItems.length - 1));
  searchResults.innerHTML = sItems.length ? sItems.map((it, i) => `<button class="menu-item ${i === sIdx ? 'kb' : ''}" data-i="${i}"><span class="mi-ico"><svg class="i"><use href="#${it.ico}"/></svg></span><span><b>${esc(it.label)}</b><small>${esc(it.sub)}</small></span><span class="sr-type">${it.type}</span></button>`).join('') : `<div class="empty-note">No train, station or signal matches “${esc(searchInput.value)}”.</div>`;
  searchResults.hidden = false;
}
searchInput.addEventListener('input', () => { sIdx = 0; renderSearch(); });
searchInput.addEventListener('focus', renderSearch);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sIdx++; renderSearch(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sIdx--; renderSearch(); e.preventDefault(); }
  else if (e.key === 'Enter') { const it = sItems[sIdx]; if (it) { select(it.e); searchInput.value = ''; searchResults.hidden = true; searchInput.blur(); $('#search').classList.remove('open'); } }
  else if (e.key === 'Escape') { searchInput.value = ''; searchResults.hidden = true; searchInput.blur(); $('#search').classList.remove('open'); }
});
searchResults.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; select(sItems[+b.dataset.i].e); searchInput.value = ''; searchResults.hidden = true; $('#search').classList.remove('open'); });
$('#searchToggle').addEventListener('click', e => { e.stopPropagation(); const s = $('#search'); s.classList.toggle('open'); if (s.classList.contains('open')) setTimeout(() => searchInput.focus(), 30); });
// areas
const AREA_NAME = { WGT: 'Westgate', FDR: 'Foundry Rd', MKS: 'Market Sq', HBP: 'Harbour Pk' };
const AREAS = [{ id: 'overview', label: 'Overview', short: 'All' }, ...STATIONS.map(s => ({ id: s.id, label: AREA_NAME[s.id], short: s.id, e: s })), { id: 'depot', label: 'Depot', short: 'NFD', e: depot }];
function areaButtons(full) { return AREAS.map((a, i) => `<button data-area="${a.id}" title="${a.label} · key ${i + 1}">${full ? `<span class="full">${a.label}</span><span class="short code">${a.short}</span>` : a.label}</button>`).join(''); }
$('#areas').innerHTML = areaButtons(true); $('#mbAreas').innerHTML = areaButtons(false);
function goArea(id) { const a = AREAS.find(x => x.id === id); if (!a) return; if (a.e) select(a.e); else { select(null); flyHome(); } }
for (const el of [$('#areas'), $('#mbAreas')]) el.addEventListener('click', e => { const b = e.target.closest('[data-area]'); if (b) goArea(b.dataset.area); });
function updateAreaButtons() {
  const id = !sel ? 'overview' : sel.type === 'station' ? sel.id : sel.type === 'depot' ? 'depot' : null;
  document.querySelectorAll('[data-area]').forEach(b => { const on = b.dataset.area === id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
// keyboard
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === '/') { e.preventDefault(); if (matchMedia('(max-width: 1240px)').matches) $('#search').classList.add('open'); searchInput.focus(); return; }
  if (e.key === 'Escape') { closeMenus(); if (sel) select(null); return; }
  if (e.key === 'f' && sel && sel.type === 'train') { follow = follow === sel ? null : sel; if (follow) flyTo(sel); refreshDetailHead(); return; }
  if (e.key === 'n') { setNight(env.target < 0.5); return; }
  if (/^[1-6]$/.test(e.key)) { goArea(AREAS[+e.key - 1].id); return; }
  const pan = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] }[e.key];
  if (pan) { follow = null; glide = null; const k = goal.dist * 0.08, ca = Math.cos(goal.az), sa = Math.sin(goal.az); goal.tx += (pan[0] * ca + pan[1] * sa) * k; goal.tz += (-pan[0] * sa + pan[1] * ca) * k; clampTarget(goal); refreshDetailHead(); }
  if (e.key === 'q') goal.az += 0.15; if (e.key === 'e') goal.az -= 0.15;
  if (e.key === '+' || e.key === '=') zoomBy(0.85); if (e.key === '-') zoomBy(1.18);
});
let hintFaded = false;
function fadeHint() { if (hintFaded) return; hintFaded = true; $('#hint').classList.add('fade'); }
setTimeout(fadeHint, 9000);

function select(e) {
  if (sel && sel.type === 'train') sel.mat.emissiveIntensity = 0;
  sel = e || null; follow = null;
  if (sel) { flyTo(sel); if (sel.type === 'train' && entityPos(sel)) follow = sel; fadeHint(); }
  setRing(sel);
  selLbl.firstChild.innerHTML = sel ? entityName(sel) : '';
  if (matchMedia('(max-width: 860px)').matches) detailEl.classList.toggle('peek', !sel);
  lastHead = ''; renderDetail(true); renderJourney(); updateAreaButtons(); renderTable();
  setTimeout(measureFree, 60);
}

/* =====================================================================
   SIM LOOP
   ===================================================================== */
let depotTimer = 0, histTimer = 0, speedTimer = 0;
function simStep(dt) {
  simT += dt;
  for (const P of PLATFORMS) P.waiting += platformRate(P, simT) * dt;
  ridersToday += lineRate(simT) * SEASON.ridership * dt;
  for (const st of STATIONS) st.entries += (platformRate(st.pf.EB, simT) + platformRate(st.pf.WB, simT)) * dt;
  dispatch(termW); dispatch(termE);
  depotTimer += dt; if (depotTimer >= 1) { depotTimer = 0; depotStep(); linkStep(); }
  for (const t of trains) if (!t.maint) trainStep(t, dt);
  rebuildOcc(); computeSignals();
  trafficStep(dt);
  if (!prewarming) agentsStep(dt);
  speedTimer += dt; if (speedTimer >= 1) { speedTimer = 0; for (const t of trains) { t.speedHist.push(t.v); if (t.speedHist.length > 90) t.speedHist.shift(); } }
  histTimer += dt; if (histTimer >= 15) { histTimer = 0; kpiHist.ontime.push(ontimePct()); kpiHist.rate.push(lineRate(simT) * 60 * SEASON.ridership); for (const k in kpiHist) if (kpiHist[k].length > 80) kpiHist[k].shift(); }
}
function trainVisuals(time) {
  let bi = 0; const bo = Math.max(env.night, env.fog * 0.85) * 0.55;
  for (const t of trains) {
    placeTrain(t);
    const target = sel === t ? 0.16 + Math.sin(time * 4) * 0.06 : hover === t ? 0.1 : 0;
    t.mat.emissiveIntensity += (target - t.mat.emissiveIntensity) * 0.2;
    t.mat.color.setRGB(1, 1, 1).lerp(_c1.set('#D6D0C2'), t.dirt * 0.55);
    if (t.group.visible && t.route.length && !t.maint && t.state !== 'stabled') {
      const a = trainPoint(t, -7, _pa), b = trainPoint(t, -1, _pb);
      beamMesh.setMatrixAt(bi++, M((a.x + b.x) / 2, a.y + 0.2, (a.z + b.z) / 2, 4.2, 1, 13, Math.atan2(-(a.z - b.z), a.x - b.x) + Math.PI / 2));
    }
  }
  beamMesh.count = bi; beamMesh.instanceMatrix.needsUpdate = true; beamMesh.material.opacity = bo;
}
function updateShadowCam() {
  const ext = clamp(view.dist * 0.72, 70, 340), sc = sun.shadow.camera;
  if (sc.right !== ext) { sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 10; sc.far = 1300; sc.updateProjectionMatrix(); }
  const n = env.night, dx = lerp(-0.52, 0.35, n), dy = lerp(0.74, 0.86, n), dz = lerp(0.42, -0.36, n), L = Math.hypot(dx, dy, dz);
  sun.position.set(view.tx + dx / L * 500, dy / L * 500, view.tz + dz / L * 500); sun.target.position.set(view.tx, 0, view.tz); sun.target.updateMatrixWorld();
}
function uiTick() {
  $('#clock').textContent = fmtClock(simT);
  renderKPIs(); renderDetail(); renderJourney();
  uiTick.n = (uiTick.n || 0) + 1; if (uiTick.n % 2 === 0) renderTable();
  for (const st of STATIONS) { const p = Math.max(crowdPct(st.pf.EB), crowdPct(st.pf.WB)); st.lbl.querySelector('.crowd').className = 'crowd ' + crowdCls(p); }
  for (const t of trains) { t.lbl.firstChild.className = 'ttag' + (t.inService ? '' : ' depot'); const tx = t.inService ? t.run : t.rake; if (t.lbl.firstChild.textContent !== tx) t.lbl.firstChild.textContent = tx; }
  if (hover) hovLbl.firstChild.innerHTML = entityName(hover);
  if (sel) selLbl.firstChild.innerHTML = entityName(sel);
  if (uiTick.n % 2 === 0) measureFree();
}
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  const time = now / 1000;
  let dt = rdt * simSpeed; while (dt > 1e-6) { const h = Math.min(0.1, dt); simStep(h); dt -= h; }
  applyEnv(rdt, time);
  trainVisuals(time); placeVehicles(); placePeople(time); updateLamps(); washVisual(simSpeed ? rdt * Math.min(simSpeed, 2) : 0); fireworksStep(rdt, time);
  rainU.uCenter.value.set(view.tx, 0, view.tz);
  updateCamera(rdt); updateShadowCam(); updateRing(time);
  renderer.render(scene, camera);
  updateLabels();
  frame.acc = (frame.acc || 0) + rdt; if (frame.acc > 0.25) { frame.acc = 0; uiTick(); }
  requestAnimationFrame(frame);
}
function resize() { searchInput.placeholder = innerWidth > 1480 || innerWidth <= 1240 ? 'Search trains, stations, signals' : 'Search the line'; renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; measureFree(); viewOff.x = viewOff.tx; viewOff.y = viewOff.ty; applyCamera(); }
addEventListener('resize', resize);

/* =====================================================================
   BOOT: start the day already running
   ===================================================================== */
(function boot() {
  const now = new Date();
  const tod = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const PRE = 900;
  simT = tod - PRE;
  ridersToday = ridersUntil(Math.max(0, simT));
  const shareSum = STATIONS.reduce((a, s) => a + s.share, 0);
  for (const st of STATIONS) { st.entries = ridersToday * 0.34 * st.share / shareSum; st.boarded = st.entries * 0.97; }
  for (const P of PLATFORMS) P.waiting = platformRate(P, simT) * 30;
  termW.nextSlot = simT + 2; termE.nextSlot = simT + 2 + H() / 2;
  [0, 2, 4, 7].forEach((i, k) => { trains[i].state = 'term'; trains[i].readyAt = simT; trains[i].inService = true; trains[i].dir = 'EB'; termW.queue.push(trains[i]); });
  [1, 3, 5].forEach(i => { trains[i].state = 'term'; trains[i].readyAt = simT; trains[i].inService = true; trains[i].dir = 'WB'; termE.queue.push(trains[i]); });
  [8, 9].forEach((i, k) => { const t = trains[i], r = depot.roads[k]; t.route = [r.edge]; t.hi = 0; t.s = r.stabS; t.state = 'stabled'; t.stabledAt = simT - 1800 - k * 900; t.road = r; r.train = t; t.lastWash = simT - 2400 - k * 600; t.dirt = 0.05; });
  for (const t of trains) t.lastWash = t.lastWash ?? simT - rnd(3, 9) * 3600;
  depot.nextSwap = simT + PRE - 40;
  prewarming = true;
  rebuildOcc(); computeSignals();
  for (let i = 0; i < PRE / 0.2; i++) simStep(0.2);
  prewarming = false;
  ontimeLog.splice(0, Math.max(0, ontimeLog.length - 60));
  alerts.length = 0; unread = 0; seedCrowds();
  alert('info', 'Harbour Park escalator E3 out of service for step-chain replacement until 18:00', STATIONS[3]);
  alert('info', 'TS-07 in Northfield shed for bogie inspection, work order WO-4471', maintTrain);
  alert('ok', `Green Line running to timetable: ${fleetTarget()} trains, ${H()} s headway`, null);
  unread = 2; updateBadge();
  renderWeatherMenu(); updateSpeedUI(); updateAreaButtons();
  renderer.setSize(innerWidth, innerHeight, false);
  if (matchMedia('(max-width: 860px)').matches) detailEl.classList.add('peek');
  resize(); applyEnv(1, 0); env.night = env.target;
  renderDetail(true); renderJourney(); renderTable(); renderKPIs();
  window.__railgrid = { trains, SIGNALS, STATIONS, PLATFORMS, EDGES, lanes, agents, depot, termW, termE, ontimeLog, get simT() { return simT; }, get season() { return SEASON.id; }, get sel() { return sel; }, env, camera, renderer, scene, select, setSeason, setNight, view, goal, simStep, setSpeed: v => { simSpeed = v; updateSpeedUI(); } };
  requestAnimationFrame(t => { last = t; frame(t); });
})();
